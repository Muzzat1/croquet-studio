<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Soft shadow blur filter -->
    <filter id="shadow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" />
    </filter>

    <!-- Wood textures for mallet head and shaft -->
    <linearGradient id="shaft-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b25f35" />
      <stop offset="100%" stop-color="#5c2c16" />
    </linearGradient>
    
    <linearGradient id="head-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a3a1a" />
      <stop offset="50%" stop-color="#a8562e" />
      <stop offset="100%" stop-color="#5c2c16" />
    </linearGradient>

    <!-- Gold brass end-cap gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe680" />
      <stop offset="30%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa8010" />
      <stop offset="100%" stop-color="#805d00" />
    </linearGradient>

    <!-- 3D Spherical Radial Gradient for Blue Croquet Ball -->
    <radialGradient id="ball-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#64b5f6" />
      <stop offset="40%" stop-color="#1565c0" />
      <stop offset="90%" stop-color="#0d47a1" />
      <stop offset="100%" stop-color="#0a2a5c" />
    </radialGradient>
  </defs>

  <!-- 0. Premium Contrasting Background Shield -->
  <circle cx="32" cy="32" r="29" fill="#ffffff" stroke="url(#gold-grad)" stroke-width="2.5" />

  <!-- 1. Ambient Shadows -->
  <ellipse cx="20" cy="54" rx="14" ry="4" fill="#000000" fill-opacity="0.35" filter="url(#shadow-blur)" />
  <ellipse cx="43" cy="54" rx="11" ry="3.5" fill="#000000" fill-opacity="0.4" filter="url(#shadow-blur)" />

  <!-- 2. Mallet Shaft -->
  <line x1="48" y1="8" x2="20" y2="44" stroke="url(#shaft-grad)" stroke-width="3" stroke-linecap="round" />

  <!-- 3. Stylized Mallet Grip Wrap (White & Gold highlights) -->
  <line x1="48" y1="8" x2="40" y2="18" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" />
  <!-- Grip rib details -->
  <line x1="47.3" y1="9" x2="45.7" y2="11" stroke="#cccccc" stroke-width="0.8" />
  <line x1="44.8" y1="12" x2="43.2" y2="14" stroke="#cccccc" stroke-width="0.8" />
  <line x1="42.3" y1="15" x2="40.7" y2="17" stroke="#cccccc" stroke-width="0.8" />
  
  <!-- Grip Gold Ring Limit -->
  <circle cx="40" cy="18" r="2.2" fill="url(#gold-grad)" />

  <!-- 4. Mallet Hammer Head (rotated perpendicularly at 45 degrees) -->
  <g transform="translate(20, 44) rotate(45)">
    <!-- Wood Head cylinder -->
    <rect x="-14" y="-7" width="28" height="14" rx="2.5" fill="url(#head-grad)" stroke="#3e2512" stroke-width="1" />
    <!-- Gold Brass End-Caps -->
    <rect x="-16.5" y="-7" width="3" height="14" rx="1" fill="url(#gold-grad)" />
    <rect x="13.5" y="-7" width="3" height="14" rx="1" fill="url(#gold-grad)" />
    <!-- Center shaft socket cap -->
    <circle cx="0" cy="-6.5" r="2" fill="url(#gold-grad)" />
  </g>

  <!-- 5. Premium 3D Croquet Ball -->
  <circle cx="43" cy="42" r="12.5" fill="url(#ball-grad)" />
  
  <!-- Classic Croquet Ball milled concentric ring detail -->
  <circle cx="43" cy="42" r="8" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="0.75" />
  <circle cx="43" cy="42" r="5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="0.75" />
</svg>